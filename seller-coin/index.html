<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Seller - My Solas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/seller-coin/styles.css">
    <!-- Load Supabase from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- LOGIN SECTION -->
    <div class="card" id="login-section">
        <div class="text-center mb-4">
            <img src="/2.png" alt="My Solas" style="height: 38px; margin-bottom: 14px;">
            <h2>Coin Seller Portal</h2>
            <p class="text-muted">Recharge users safely on your browser.</p>
        </div>

        <div id="login-alert" class="alert alert-error"></div>

        <button id="btn-login" class="btn btn-google">
            <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign in with Google
        </button>
    </div>

    <!-- LOADING SECTION -->
    <div class="card text-center" id="loading-section">
        <div style="display: flex; justify-content: center; align-items: center; min-height: 180px;">
            <div class="loader" style="border-top-color: var(--primary); width: 32px; height: 32px; border-width: 4px;"></div>
        </div>
    </div>

    <!-- DASHBOARD SECTION -->
    <div class="card" id="dashboard-section">
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <img src="/2.png" alt="My Solas" style="height: 22px;">
                <span style="font-weight: 700; font-size: 1.05rem;">Coin Seller</span>
            </div>
            <button id="btn-logout" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-weight: 600; font-size: 0.85rem; font-family: 'Inter';">Sign Out</button>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="tab-btn active" id="tab-recharge-btn">Recharge</button>
            <button class="tab-btn" id="tab-history-btn">History</button>
        </div>

        <!-- RECHARGE TAB VIEW -->
        <div id="view-recharge">
            <!-- Balance Card -->
            <div class="balance-card">
                <div>
                    <div class="balance-label">Available seller balance</div>
                    <div class="balance-value">
                        <span id="balance-text">...</span> Golds
                    </div>
                </div>
                <button class="refresh-btn" id="btn-refresh-balance" title="Refresh balance">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                    </svg>
                </button>
            </div>

            <div id="recharge-alert" class="alert"></div>

            <!-- Find Recipient Block -->
            <div class="section-block">
                <div class="section-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    Find recipient
                </div>
                <p class="text-muted">Enter the user's exact 9-digit ID</p>
                <div class="input-wrapper">
                    <input type="text" id="input-public-id" class="form-input" maxlength="9" placeholder="User ID (9 digits)">
                    <button id="btn-find-user" class="btn-sm">Find</button>
                </div>

                <!-- Preview Card when found -->
                <div id="recipient-preview" class="recipient-preview" style="display: none;">
                    <img id="recipient-avatar" class="recipient-avatar" src="/2.png" alt="avatar">
                    <div>
                        <div id="recipient-name" class="recipient-name">User</div>
                        <div id="recipient-public-id-label" class="recipient-id">ID: 123456789</div>
                    </div>
                </div>
            </div>

            <!-- Recharge Amount Block -->
            <div class="section-block">
                <div class="section-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                    Recharge amount
                </div>
                <p class="text-muted">Enter the Gold amount to send</p>
                <div class="input-wrapper" style="margin-top: 8px;">
                    <input type="number" id="input-amount" class="form-input" placeholder="Amount (e.g. 1000)" min="1">
                </div>
                <div class="quick-amounts">
                    <button type="button" class="chip" data-amt="1000">+1,000</button>
                    <button type="button" class="chip" data-amt="5000">+5,000</button>
                    <button type="button" class="chip" data-amt="10000">+10,000</button>
                    <button type="button" class="chip" data-amt="50000">+50,000</button>
                </div>
            </div>

            <button id="btn-confirm-recharge" class="btn btn-action">
                <span id="btn-recharge-text">Review recharge</span>
                <div id="btn-recharge-loader" class="loader" style="display: none;"></div>
            </button>
        </div>

        <!-- HISTORY TAB VIEW -->
        <div id="view-history" style="display: none;">
            <div style="margin-bottom: 16px;">
                <input type="text" id="input-history-search" class="form-input" style="width: 100%;" placeholder="Search reference or ID...">
            </div>
            <div id="history-list" style="max-height: 380px; overflow-y: auto;">
                <div class="text-center text-muted" style="padding: 30px;">Loading history...</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://api.solas-live.online';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg3MTY0MTY0LCJleHAiOjE5NDQ4NDQxNjR9.fyTD5-J7jJDDuyMv5QGu7Yu7if-GsblEpB8tT_eOxAg';
        
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // DOM Elements
        const loginSec = document.getElementById('login-section');
        const loadSec = document.getElementById('loading-section');
        const dashSec = document.getElementById('dashboard-section');
        const loginAlert = document.getElementById('login-alert');
        const rechargeAlert = document.getElementById('recharge-alert');
        const balanceText = document.getElementById('balance-text');
        const inputPublicId = document.getElementById('input-public-id');
        const inputAmount = document.getElementById('input-amount');
        const btnFindUser = document.getElementById('btn-find-user');
        const recipientPreview = document.getElementById('recipient-preview');
        const recipientAvatar = document.getElementById('recipient-avatar');
        const recipientName = document.getElementById('recipient-name');
        const recipientPublicIdLabel = document.getElementById('recipient-public-id-label');
        const btnConfirmRecharge = document.getElementById('btn-confirm-recharge');
        const btnRechargeText = document.getElementById('btn-recharge-text');
        const btnRechargeLoader = document.getElementById('btn-recharge-loader');
        const btnRefreshBalance = document.getElementById('btn-refresh-balance');
        
        const tabRechargeBtn = document.getElementById('tab-recharge-btn');
        const tabHistoryBtn = document.getElementById('tab-history-btn');
        const viewRecharge = document.getElementById('view-recharge');
        const viewHistory = document.getElementById('view-history');
        const historyList = document.getElementById('history-list');
        const inputHistorySearch = document.getElementById('input-history-search');

        let currentRecipient = null;

        function showSection(section) {
            loginSec.style.display = 'none';
            loadSec.style.display = 'none';
            dashSec.style.display = 'none';
            section.style.display = 'block';
        }

        function showAlert(el, msg, type = 'error') {
            el.textContent = msg;
            el.style.display = 'block';
            el.className = `alert alert-${type}`;
            setTimeout(() => el.style.display = 'none', 6000);
        }

        // Tab Switching
        tabRechargeBtn.addEventListener('click', () => {
            tabRechargeBtn.classList.add('active');
            tabHistoryBtn.classList.remove('active');
            viewRecharge.style.display = 'block';
            viewHistory.style.display = 'none';
        });

        tabHistoryBtn.addEventListener('click', () => {
            tabHistoryBtn.classList.add('active');
            tabRechargeBtn.classList.remove('active');
            viewRecharge.style.display = 'none';
            viewHistory.style.display = 'block';
            loadHistory();
        });

        // Quick Amount Chips
        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', () => {
                const add = parseInt(chip.getAttribute('data-amt'));
                const current = parseInt(inputAmount.value || 0);
                inputAmount.value = current + add;
            });
        });

        // Init auth state
        client.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT') {
                showSection(loginSec);
            } else if (session) {
                checkAccess(session.user);
            }
        });

        async function checkAccess(user) {
            showSection(loadSec);
            try {
                // Check seller role tag
                const { data: profile, error } = await client
                    .from('profiles')
                    .select('role_tags')
                    .eq('id', user.id)
                    .single();

                if (error) throw error;

                if (!profile.role_tags || !profile.role_tags.includes('seller')) {
                    await client.auth.signOut();
                    showAlert(loginAlert, "Unauthorized. You are not a registered Coin Seller.");
                    showSection(loginSec);
                    return;
                }

                // Fetch balance via dedicated RPC
                await loadBalance();
                showSection(dashSec);
            } catch (err) {
                console.error(err);
                await client.auth.signOut();
                showAlert(loginAlert, "Error loading profile: " + (err.message || err));
                showSection(loginSec);
            }
        }

        async function loadBalance() {
            balanceText.textContent = "...";
            try {
                const { data, error } = await client.rpc('get_coin_seller_balance');
                if (error) throw error;
                balanceText.textContent = parseInt(data || 0).toLocaleString();
            } catch (e) {
                console.error("Error fetching balance:", e);
                balanceText.textContent = "0";
            }
        }

        btnRefreshBalance.addEventListener('click', loadBalance);

        // Lookup User Recipient
        btnFindUser.addEventListener('click', async () => {
            const id = inputPublicId.value.trim();
            if (id.length !== 9 || isNaN(id)) {
                showAlert(rechargeAlert, "Enter a valid 9-digit user ID");
                return;
            }
            btnFindUser.disabled = true;
            btnFindUser.textContent = "...";
            try {
                const { data, error } = await client.rpc('seller_lookup_user', { p_public_id: id });
                if (error) throw error;
                if (data && data.length > 0) {
                    currentRecipient = data[0];
                    recipientName.textContent = currentRecipient.nickname || "User";
                    recipientPublicIdLabel.textContent = "ID: " + currentRecipient.public_id;
                    recipientAvatar.src = currentRecipient.avatar_url || "/2.png";
                    recipientPreview.style.display = "flex";
                } else {
                    currentRecipient = null;
                    recipientPreview.style.display = "none";
                    showAlert(rechargeAlert, "No user found with ID: " + id);
                }
            } catch (err) {
                showAlert(rechargeAlert, err.message || "Failed to lookup user");
            } finally {
                btnFindUser.disabled = false;
                btnFindUser.textContent = "Find";
            }
        });

        // Recharge Submission
        btnConfirmRecharge.addEventListener('click', async () => {
            const id = inputPublicId.value.trim();
            const amount = parseInt(inputAmount.value);

            if (!currentRecipient || currentRecipient.public_id != id) {
                showAlert(rechargeAlert, "Please click 'Find' to verify the recipient first");
                return;
            }
            if (!amount || amount <= 0) {
                showAlert(rechargeAlert, "Enter a valid Gold amount");
                return;
            }

            if (!confirm(`Are you sure you want to recharge ${amount.toLocaleString()} Golds to ${currentRecipient.nickname} (${currentRecipient.public_id})?`)) {
                return;
            }

            btnConfirmRecharge.disabled = true;
            btnRechargeText.style.display = 'none';
            btnRechargeLoader.style.display = 'block';

            try {
                const { data, error } = await client.rpc('seller_recharge_user', {
                    p_public_id: id,
                    p_coin_amount: amount
                });

                if (error) throw error;

                showAlert(rechargeAlert, `Successfully recharged ${amount.toLocaleString()} Golds to ${currentRecipient.nickname}!`, 'success');
                inputAmount.value = "";
                await loadBalance();
            } catch (err) {
                showAlert(rechargeAlert, err.message || "Failed to process recharge");
            } finally {
                btnConfirmRecharge.disabled = false;
                btnRechargeText.style.display = 'block';
                btnRechargeLoader.style.display = 'none';
            }
        });

        // Load History
        async function loadHistory() {
            historyList.innerHTML = '<div class="text-center text-muted" style="padding: 20px;">Loading...</div>';
            try {
                const query = inputHistorySearch.value.trim();
                const { data, error } = await client.rpc('get_coin_seller_activity_history', {
                    p_query: query,
                    p_limit: 50
                });
                if (error) throw error;
                if (!data || data.length === 0) {
                    historyList.innerHTML = '<div class="text-center text-muted" style="padding: 30px;">No transactions found</div>';
                    return;
                }
                historyList.innerHTML = data.map(item => `
                    <div class="history-item">
                        <div class="history-info">
                            <img src="${item.recipient_avatar_url || '/2.png'}" style="width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #eee;">
                            <div>
                                <div style="font-weight: 700; font-size: 0.9rem;">${item.recipient_name || 'User'}</div>
                                <div style="font-size: 0.78rem; color: #64748B;">ID: ${item.recipient_public_id || 'N/A'} · ${new Date(item.created_at).toLocaleDateString()}</div>
                            </div>
                        </div>
                        <div class="history-amount">-${parseInt(item.coin_amount).toLocaleString()} G</div>
                    </div>
                `).join('');
            } catch (err) {
                historyList.innerHTML = `<div class="text-center alert alert-error" style="display:block;">${err.message || 'Failed to load history'}</div>`;
            }
        }

        let searchTimeout;
        inputHistorySearch.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(loadHistory, 400);
        });

        // Login action
        document.getElementById('btn-login').addEventListener('click', async () => {
            const { error } = await client.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: 'https://www.solas-live.online/seller-coin/'
                }
            });
            if (error) showAlert(loginAlert, error.message);
        });

        // Logout action
        document.getElementById('btn-logout').addEventListener('click', async () => {
            await client.auth.signOut();
        });

        // Initial check
        client.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                checkAccess(session.user);
            } else {
                showSection(loginSec);
            }
        });
    </script>
</body>
</html>
