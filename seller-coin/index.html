<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Seller Portal - My Solas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Load Supabase from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- LOGIN SECTION -->
    <div class="card" id="login-section">
        <div class="text-center mb-4">
            <img src="../2.png" alt="My Solas" style="height: 40px; margin-bottom: 16px;">
            <h2>Coin Seller Portal</h2>
            <p class="text-muted">Secure access for authorized coin sellers.</p>
        </div>

        <div id="login-alert" class="alert alert-error"></div>

        <button id="btn-login" class="btn btn-google">
            <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign in with Google
        </button>
    </div>

    <!-- LOADING SECTION -->
    <div class="card text-center" id="loading-section">
        <div style="display: flex; justify-content: center; align-items: center; min-height: 150px;">
            <div class="loader" style="border-top-color: var(--primary);"></div>
        </div>
    </div>

    <!-- DASHBOARD SECTION -->
    <div class="card" id="dashboard-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <img src="../2.png" alt="My Solas" style="height: 24px;">
            <button id="btn-logout" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-weight: 600; font-family: 'Inter';">Sign Out</button>
        </div>

        <div class="balance-card">
            <p class="text-muted" style="font-weight: 600;">Available Inventory</p>
            <div class="balance-amount">
                <span id="balance-text">...</span>
                <svg class="balance-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" fill="#FFB800"/>
                    <path d="M12 16.5C14.4853 16.5 16.5 14.4853 16.5 12C16.5 9.51472 14.4853 7.5 12 7.5C9.51472 7.5 7.5 9.51472 7.5 12C7.5 14.4853 9.51472 16.5 12 16.5Z" fill="#FFD600"/>
                </svg>
            </div>
        </div>

        <h3>Recharge User</h3>
        <p class="text-muted mb-3">Transfer golds instantly to any user.</p>

        <div id="recharge-alert" class="alert"></div>

        <form id="recharge-form">
            <div class="input-group">
                <label for="public-id">User ID (9 Digits)</label>
                <input type="text" id="public-id" required maxlength="9" pattern="\d{9}" placeholder="e.g. 123456789">
            </div>

            <div class="input-group">
                <label for="amount">Gold Amount</label>
                <input type="number" id="amount" required min="1" placeholder="Enter amount">
            </div>

            <button type="submit" id="btn-submit" class="btn btn-primary">
                <span id="btn-text">Confirm Recharge</span>
                <div id="btn-loader" class="loader" style="display: none;"></div>
            </button>
        </form>
    </div>

    <script>
        // Configuration - DO NOT COMMIT SECRETS IN PRODUCTION IF THIS WAS A PUBLIC REPO
        // However, Supabase Anon keys are safe to be public.
        const SUPABASE_URL = 'https://api.solas-live.online';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg3MTY0MTY0LCJleHAiOjE5NDQ4NDQxNjR9.fyTD5-J7jJDDuyMv5QGu7Yu7if-GsblEpB8tT_eOxAg';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // DOM Elements
        const loginSec = document.getElementById('login-section');
        const loadSec = document.getElementById('loading-section');
        const dashSec = document.getElementById('dashboard-section');
        const loginAlert = document.getElementById('login-alert');
        const rechargeAlert = document.getElementById('recharge-alert');
        const balanceText = document.getElementById('balance-text');
        const form = document.getElementById('recharge-form');
        const btnSubmit = document.getElementById('btn-submit');
        const btnText = document.getElementById('btn-text');
        const btnLoader = document.getElementById('btn-loader');

        function showSection(section) {
            loginSec.style.display = 'none';
            loadSec.style.display = 'none';
            dashSec.style.display = 'none';
            section.style.display = 'block';
        }

        function showAlert(el, msg, type = 'error') {
            el.textContent = msg;
            el.style.display = 'block';
            el.className = `alert alert-${type}`;
            setTimeout(() => el.style.display = 'none', 5000);
        }

        // Init auth state
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT') {
                showSection(loginSec);
            } else if (session) {
                checkAccess(session.user);
            }
        });

        async function checkAccess(user) {
            showSection(loadSec);
            try {
                // Check if user has seller tag
                const { data: profile, error } = await supabase
                    .from('profiles')
                    .select('role_tags')
                    .eq('id', user.id)
                    .single();

                if (error) throw error;

                if (!profile.role_tags || !profile.role_tags.includes('seller')) {
                    await supabase.auth.signOut();
                    showAlert(loginAlert, "Unauthorized. You are not a registered Coin Seller.");
                    showSection(loginSec);
                    return;
                }

                // Fetch balance
                await loadBalance(user.id);
                showSection(dashSec);
            } catch (err) {
                console.error(err);
                await supabase.auth.signOut();
                showAlert(loginAlert, "Error loading profile.");
                showSection(loginSec);
            }
        }

        async function loadBalance(userId) {
            const { data, error } = await supabase
                .from('seller_wallets')
                .select('coin_balance')
                .eq('user_id', userId)
                .single();
            
            if (data) {
                balanceText.textContent = parseInt(data.coin_balance).toLocaleString();
            } else {
                balanceText.textContent = "0";
            }
        }

        // Login action
        document.getElementById('btn-login').addEventListener('click', async () => {
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + window.location.pathname
                }
            });
            if (error) showAlert(loginAlert, error.message);
        });

        // Logout action
        document.getElementById('btn-logout').addEventListener('click', async () => {
            await supabase.auth.signOut();
        });

        // Form submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const publicId = document.getElementById('public-id').value;
            const amount = parseInt(document.getElementById('amount').value);

            btnSubmit.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'block';

            try {
                const { data, error } = await supabase.rpc('seller_recharge_user', {
                    p_public_id: publicId,
                    p_coin_amount: amount
                });

                if (error) throw error;

                showAlert(rechargeAlert, `Successfully recharged ${amount.toLocaleString()} golds!`, 'success');
                form.reset();
                
                // Update balance on screen
                const session = await supabase.auth.getSession();
                if (session.data.session) {
                    await loadBalance(session.data.session.user.id);
                }
            } catch (err) {
                showAlert(rechargeAlert, err.message || "Failed to process recharge.");
            } finally {
                btnSubmit.disabled = false;
                btnText.style.display = 'block';
                btnLoader.style.display = 'none';
            }
        });

        // Initial check
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                checkAccess(session.user);
            } else {
                showSection(loginSec);
            }
        });
    </script>
</body>
</html>
